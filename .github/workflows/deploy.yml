name: Publicar site na Hostinger

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar o lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # FTPS (FTP com TLS): a senha e os arquivos trafegam criptografados (FTP comum envia tudo aberto).
      # lftp em vez do FTP-Deploy-Action: com a Hostinger, o FTP-Deploy-Action caía na conexão de
      # dados criptografada ("ECONNRESET (data socket)").
      # - Conta FTP só de publicação (FTP_USERNAME = u977135034.deploy): ela abre DENTRO do
      #   public_html e não enxerga o resto da hospedagem. Por isso o destino é "./".
      # - O certificado do servidor é conferido. Ele é emitido para *.hstgr.io, então o
      #   FTP_SERVER é o nome do servidor da Hostinger (srv1896.hstgr.io, informado pelo suporte),
      #   sem ftp://, barra ou porta. Com o IP, a conferência falha.
      # - Trava: só envia se a pasta de chegada for a do site (tem academiadevirtudes/); se não for,
      #   para sem enviar nada e o "pwd" mostra no registro onde estava.
      # - Destino "." sem barra no fim (com barra, o lftp pode criar uma subpasta).
      # - Envia só o que mudou e NUNCA apaga nada no servidor (sem --delete).
      # - A senha vai por variável de ambiente (--env-password), não na linha de comando.
      - name: Enviar arquivos via FTPS para a Hostinger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ssl:check-hostname yes;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 30;
            set cmd:fail-exit yes;
            pwd;
            cd academiadevirtudes;
            cd ..;
            mirror --reverse --verbose=1 --parallel=3 \
              --exclude '(^|/)\.git' \
              --exclude '(^|/)node_modules/' \
              --exclude '^GPM_CRM/' \
              --exclude '^CRM/' \
              --exclude '^supabase/' \
              --exclude '^_notas/' \
              --exclude '^academiadevirtudes/fotos/' \
              --exclude '\.md$' \
              --exclude '\.ps1$' \
              --exclude '\.sql$' \
              --exclude '(^|/)\.env' \
              . .;
            bye
          "
          # Nada da lista acima vai para o site. Não remova itens sem revisar a segurança.
